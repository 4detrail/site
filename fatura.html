<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXAGES GAMES – Fatura Yönetimi</title>
    <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0a0b0f">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .upload-area {
      border: 2px dashed var(--border);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .upload-area:hover, .upload-area.drag-over {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.03);
    }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-preview {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #34d399;
      display: none;
    }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 600px) { .form-grid-2 { grid-template-columns: 1fr; } }
    .fatura-card {
      border: 1px solid var(--border);
      margin-bottom: 12px;
      transition: border-color 0.3s;
    }
    .fatura-card:hover { border-color: rgba(255,255,255,0.2); }
    .fatura-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; cursor: pointer; width: 100%;
      background: transparent; border: none; color: var(--foreground); text-align: left; gap: 12px;
    }
    .fatura-card-body { display: none; padding: 16px 20px; border-top: 1px solid var(--border); }
    .fatura-card-body.open { display: block; }
    .badge-aktif { font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border: 1px solid rgba(52,211,153,0.4); color: #34d399; }
    .badge-no { font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border: 1px solid var(--border); color: var(--muted-foreground); }
  </style>
</head>
<body>
  <div id="layout-top"></div>

  <main>
    <section style="min-height:100vh;padding-top:128px;padding-bottom:96px;padding-left:24px;padding-right:24px">
      <div class="container" style="max-width:900px">

        <div class="anim-in anim-in-delay-1" style="margin-bottom:56px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
              <span class="mono-label">// ADMİN PANELİ</span>
              <span style="font-family:var(--font-mono);font-size:10px;border:1px solid rgba(245,197,66,0.3);color:#f5c542;padding:2px 8px">⚡ ADMIN TERMİNAL</span>
            </div>
            <h1 style="font-family:var(--font-heading);font-weight:900;font-size:clamp(2.5rem,6vw,5rem);line-height:1">FATURA</h1>
          </div>
          <button onclick="loadFaturalar()" style="margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted-foreground);font-family:var(--font-mono);font-size:11px;padding:8px 16px;cursor:pointer;transition:all 0.3s" onmouseover="this.style.borderColor='white';this.style.color='white'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted-foreground)'">
            ↺ YENİLE
          </button>
        </div>

        <!-- Yetkisiz -->
        <div id="not-authorized" style="display:none;text-align:center;padding:64px 24px;border:1px solid var(--border)">
          <p style="font-family:var(--font-mono);font-size:13px;color:var(--muted-foreground);margin-bottom:24px">Bu sayfa yalnızca adminlere açıktır.</p>
          <a href="index.html" class="btn-download" style="font-size:11px">ANA SAYFA</a>
        </div>

        <div id="fatura-content" style="display:none">

          <!-- ===== FATURA OLUŞTURMA FORMU ===== -->
          <div style="border:1px solid var(--border);padding:36px;margin-bottom:56px;position:relative;overflow:hidden" class="anim-in anim-in-delay-2">
            <div class="shimmer" style="position:absolute;inset:0;pointer-events:none"></div>
            <div style="position:relative;z-index:1">
              <span class="mono-label" style="display:block;margin-bottom:28px">// YENİ FATURA OLUŞTUR</span>

              <div id="f-success" class="success-msg" style="display:none">✓ Fatura başarıyla oluşturuldu!</div>
              <div id="f-error" class="error-msg" style="display:none"></div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label">FATURA NO *</label>
                  <input type="text" id="f-no" class="form-input" placeholder="HEX-2025-001" style="text-transform:uppercase">
                </div>
                <div class="form-group">
                  <label class="form-label">MÜŞTERİ E-POSTA *</label>
                  <input type="email" id="f-email" class="form-input" placeholder="kullanici@ornek.com">
                </div>
                <div class="form-group">
                  <label class="form-label">FATURA TARİHİ *</label>
                  <input type="date" id="f-tarih" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label">ÖDEME YÖNTEMİ</label>
                  <select id="f-odeme" class="select-input">
                    <option>Kredi Kartı</option>
                    <option>Banka Havalesi</option>
                    <option>PayPal</option>
                    <option>Kripto Para</option>
                    <option>Nakit</option>
                    <option>Diğer</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">TUTAR</label>
                  <input type="text" id="f-tutar" class="form-input" placeholder="₺0.00">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">AÇIKLAMA *</label>
                <textarea id="f-aciklama" class="textarea-input" placeholder="Satın alınan ürün/hizmet detayları..." style="height:96px"></textarea>
              </div>

              <!-- Dekont Fotoğrafı Yükleme -->
              <div class="form-group">
                <label class="form-label">DEKONT FOTOĞRAFI <span style="color:var(--muted-foreground)">(opsiyonel · JPG/PNG/WEBP/PDF · maks 5MB)</span></label>
                <div class="upload-area" id="upload-area">
                  <input type="file" id="f-dekont" accept=".jpg,.jpeg,.png,.webp,.pdf" onchange="onFileChange(event)">
                  <div id="upload-placeholder">
                    <div style="font-size:2rem;margin-bottom:8px">📎</div>
                    <p style="font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)">Dosyayı buraya sürükle veya tıkla</p>
                  </div>
                </div>
                <div class="upload-preview" id="upload-preview"></div>
              </div>

              <!-- Upload progress -->
              <div id="upload-progress" style="display:none;margin-bottom:16px">
                <div style="font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);margin-bottom:6px">YÜKLENIYOR...</div>
                <div style="height:2px;background:var(--border);overflow:hidden">
                  <div id="progress-bar" style="height:100%;background:#34d399;width:0%;transition:width 0.3s"></div>
                </div>
              </div>

              <button onclick="createFatura()" id="btn-create" class="btn-submit" style="width:auto;padding:14px 36px;font-size:11px">
                FATURA OLUŞTUR
              </button>
            </div>
          </div>

          <!-- ===== FATURA LİSTESİ ===== -->
          <div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
              <span class="mono-label">// TÜM FATURALAR</span>
              <span id="fatura-count" style="font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)"></span>
            </div>
            <div id="f-loading" style="font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);text-align:center;padding:32px">YÜKLENİYOR...</div>
            <div id="fatura-list"></div>
            <div id="f-empty" style="display:none;font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);text-align:center;padding:32px;border:1px solid var(--border)">Henüz fatura yok.</div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <div id="layout-footer"></div>

  <script type="module">
    import { getNavHTML, getFooterHTML } from './js/layout.js';
    import {
      auth, isAdmin, initStarfield, initCursorGlow, initTheme, initNavbar, initReveal, initAuthNav,
      onAuthStateChanged, saveFatura, getAllFaturalar, deleteFatura, sanitize
    } from './js/app.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    document.getElementById('layout-footer').innerHTML = getFooterHTML();
    initTheme(); initStarfield(); initCursorGlow(); initNavbar(); initReveal(); initAuthNav();

    document.getElementById('f-tarih').value = new Date().toISOString().split('T')[0];

    let adminUser = null;
    let selectedFile = null;

    // Drag & drop
    const uploadArea = document.getElementById('upload-area');
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) setFile(file);
    });

    window.onFileChange = (e) => {
      const file = e.target.files[0];
      if (file) setFile(file);
    };

    function setFile(file) {
      selectedFile = file;
      const preview = document.getElementById('upload-preview');
      const placeholder = document.getElementById('upload-placeholder');
      preview.style.display = 'block';
      preview.textContent = `✓ ${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
      placeholder.innerHTML = `<p style="font-family:var(--font-mono);font-size:11px;color:#34d399">✓ ${sanitize(file.name)}</p>`;
    }

    onAuthStateChanged(auth, async user => {
      if (!user || !isAdmin(user.email)) {
        document.getElementById('not-authorized').style.display = 'block';
        return;
      }
      adminUser = user;
      document.getElementById('fatura-content').style.display = 'block';
      await loadFaturalar();
    });

    window.loadFaturalar = async () => {
      if (!adminUser) return;
      document.getElementById('f-loading').style.display = 'block';
      document.getElementById('fatura-list').innerHTML = '';
      document.getElementById('f-empty').style.display = 'none';
      try {
        const list = await getAllFaturalar();
        document.getElementById('f-loading').style.display = 'none';
        document.getElementById('fatura-count').textContent = list.length + ' fatura';
        if (list.length === 0) { document.getElementById('f-empty').style.display = 'block'; return; }

        const container = document.getElementById('fatura-list');
        list.forEach(f => {
          const tarih = f.tarih || '—';
          const createdAt = f.createdAt ? new Date(f.createdAt).toLocaleDateString('tr-TR') : '—';
          const card = document.createElement('div');
          card.className = 'fatura-card';
          card.innerHTML = `
            <button class="fatura-card-header" onclick="toggleCard('${f.id}')">
              <div style="flex:1">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
                  <span class="badge-aktif">● AKTİF</span>
                  <span class="badge-no">${sanitize(f.faturaNo)}</span>
                  <span class="badge-no">${sanitize(f.odemeYontemi)}</span>
                  ${f.dekontURL ? '<span class="badge-no" style="color:#60a5fa;border-color:rgba(96,165,250,0.3)">📎 DEKONT</span>' : ''}
                </div>
                <p style="font-family:var(--font-mono);font-size:13px">${sanitize(f.email)}</p>
                ${f.tutar ? `<p style="font-family:var(--font-mono);font-size:11px;color:#34d399;margin-top:4px">${sanitize(f.tutar)}</p>` : ''}
              </div>
              <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
                <span style="font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)">${tarih}</span>
                <span id="chev-${f.id}" style="font-size:11px;transition:transform 0.3s">▼</span>
              </div>
            </button>
            <div class="fatura-card-body" id="body-${f.id}">
              <p style="font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);line-height:1.7;margin-bottom:12px;white-space:pre-wrap">${sanitize(f.aciklama)}</p>
              <p style="font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)">Oluşturulma: ${createdAt}</p>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
                <a href="dekont.html?no=${encodeURIComponent(f.faturaNo)}" class="btn-submit" style="display:inline-block;padding:8px 18px;font-size:11px;text-decoration:none">
                  DEKONTu GÖRÜNTÜLE
                </a>
                <button onclick="window.deleteFaturaCard('${f.id}','${encodeURIComponent(f.dekontURL || '')}','${sanitize(f.faturaNo)}')" class="btn-submit" style="display:inline-block;padding:8px 18px;font-size:11px;background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.4);color:#f87171">
                  🗑 SİL
                </button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('f-loading').style.display = 'none';
        document.getElementById('f-error').textContent = 'Yüklenemedi: ' + err.message;
        document.getElementById('f-error').style.display = 'block';
      }
    };

    window.toggleCard = (id) => {
      const body = document.getElementById('body-' + id);
      const chev = document.getElementById('chev-' + id);
      const open = body.classList.toggle('open');
      chev.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    };

    window.deleteFaturaCard = async (id, encodedDekontURL, faturaNo) => {
      if (!confirm(`${faturaNo} numaralı fatura silinecek. Onaylıyor musun?`)) return;
      try {
        const dekontURL = encodedDekontURL ? decodeURIComponent(encodedDekontURL) : null;
        await deleteFatura(id, dekontURL);
        await loadFaturalar();
      } catch (err) {
        alert('Silme hatası: ' + err.message);
      }
    };

    window.createFatura = async () => {
      const faturaNo = document.getElementById('f-no').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const tarih = document.getElementById('f-tarih').value;
      const aciklama = document.getElementById('f-aciklama').value.trim();
      const odemeYontemi = document.getElementById('f-odeme').value;
      const tutar = document.getElementById('f-tutar').value.trim();
      const errEl = document.getElementById('f-error');
      const okEl = document.getElementById('f-success');
      errEl.style.display = 'none'; okEl.style.display = 'none';

      if (!faturaNo || !email || !tarih || !aciklama) {
        errEl.textContent = 'Fatura no, e-posta, tarih ve açıklama zorunludur.';
        errEl.style.display = 'block'; return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errEl.textContent = 'Geçerli bir e-posta adresi girin.';
        errEl.style.display = 'block'; return;
      }

      const btn = document.getElementById('btn-create');
      btn.disabled = true;
      btn.textContent = selectedFile ? 'YÜKLENIYOR...' : 'OLUŞTURULUYOR...';

      // Sahte progress göster
      if (selectedFile) {
        document.getElementById('upload-progress').style.display = 'block';
        let p = 0;
        const interval = setInterval(() => {
          p = Math.min(p + 15, 85);
          document.getElementById('progress-bar').style.width = p + '%';
        }, 200);
        try {
          await saveFatura({ faturaNo, email, tarih, aciklama, odemeYontemi, tutar }, selectedFile);
          clearInterval(interval);
          document.getElementById('progress-bar').style.width = '100%';
          setTimeout(() => { document.getElementById('upload-progress').style.display = 'none'; }, 500);
        } catch (err) {
          clearInterval(interval);
          document.getElementById('upload-progress').style.display = 'none';
          errEl.textContent = err.message; errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = 'FATURA OLUŞTUR'; return;
        }
      } else {
        try {
          await saveFatura({ faturaNo, email, tarih, aciklama, odemeYontemi, tutar }, null);
        } catch (err) {
          errEl.textContent = err.message; errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = 'FATURA OLUŞTUR'; return;
        }
      }

      // Formu temizle
      document.getElementById('f-no').value = '';
      document.getElementById('f-email').value = '';
      document.getElementById('f-aciklama').value = '';
      document.getElementById('f-tutar').value = '';
      document.getElementById('f-tarih').value = new Date().toISOString().split('T')[0];
      document.getElementById('f-dekont').value = '';
      document.getElementById('upload-placeholder').innerHTML = '<div style="font-size:2rem;margin-bottom:8px">📎</div><p style="font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)">Dosyayı buraya sürükle veya tıkla</p>';
      document.getElementById('upload-preview').style.display = 'none';
      selectedFile = null;
      okEl.style.display = 'block';
      setTimeout(() => { okEl.style.display = 'none'; }, 5000);
      btn.disabled = false; btn.textContent = 'FATURA OLUŞTUR';
      await loadFaturalar();
    };
  </script>
</body>
</html>
