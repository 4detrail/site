<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXAGES GAMES – Şifremi Unuttum</title>
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="layout-top"></div>

  <main>
    <div class="auth-page">
      <div class="auth-box anim-in anim-in-delay-1">

        <div class="auth-logo">
          <img src="white.png" alt="HEXAGES GAMES" class="float-anim logo-for-dark" width="64" height="56">
          <img src="logo-dark.png" alt="" class="float-anim logo-for-light" width="64" height="56" aria-hidden="true">
          <h1>ŞİFRE SIFIRLA</h1>
          <p class="sub">HEXAGES GAMES // PLAYER PORTAL</p>
        </div>

        <div class="auth-card">
          <div class="shimmer" style="position:absolute;inset:0;pointer-events:none"></div>
          <div style="position:relative;z-index:1">
            <p style="font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);margin-bottom:24px;line-height:1.7">
              E-posta adresinizi girin, şifre sıfırlama bağlantısı göndereceğiz.
            </p>

            <div id="error-msg" class="error-msg" style="display:none"></div>
            <div id="success-msg" class="success-msg" style="display:none">✓ Sıfırlama bağlantısı gönderildi! E-postanızı kontrol edin.</div>

            <div class="form-group">
              <label class="form-label">E-POSTA</label>
              <div class="form-input-wrap">
                <span class="input-icon">✉</span>
                <input type="email" id="input-email" class="form-input form-input-icon" placeholder="ornek@email.com">
              </div>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="handleReset()">BAĞLANTI GÖNDER</button>
          </div>
        </div>

        <div class="auth-footer-link">
          <a href="giris.html">← Giriş sayfasına dön</a>
        </div>

      </div>
    </div>
  </main>
  <div id="layout-footer"></div>

  <script type="module">
    import { getNavHTML, getFooterHTML } from './js/layout.js';
    import { auth, initStarfield, initCursorGlow, initTheme, initNavbar, initReveal, initAuthNav, sendPasswordResetEmail } from './js/app.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    document.getElementById('layout-footer').innerHTML = getFooterHTML();
    initTheme(); initStarfield(); initCursorGlow(); initNavbar(); initReveal(); initAuthNav();

    window.handleReset = async () => {
      const email = document.getElementById('input-email').value.trim();
      const errEl = document.getElementById('error-msg');
      const okEl = document.getElementById('success-msg');
      const btn = document.getElementById('btn-submit');
      errEl.style.display = 'none';
      okEl.style.display = 'none';

      if (!email) { errEl.textContent = 'E-posta giriniz.'; errEl.style.display = 'block'; return; }

      btn.disabled = true;
      btn.textContent = 'GÖNDERİLİYOR...';
      try {
        await sendPasswordResetEmail(auth, email);
        okEl.style.display = 'block';
      } catch (e) {
        // [GÜVENLİK] Hesap varlığını sızdırmamak için aynı mesajı göster
        errEl.textContent = 'Bir hata oluştu. Tekrar deneyin.';
        errEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'BAĞLANTI GÖNDER';
    };
  </script>
</body>
</html>
