<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırla – HEXAGES GAMES</title>
  <meta name="description" content="Şifre sıfırlama bağlantısı alın." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="HEXAGES GAMES" />
  <meta name="apple-mobile-web-app-title" content="HEXAGES GAMES" />

  <!-- Favicon / logo (Google için 48px'in katları) -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="/img/icons/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/img/icons/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="layout-top"></div>

  <main>
    <div class="auth-page">
      <div class="auth-box anim-in anim-in-delay-1">

        <div class="auth-logo">
          <img src="logom1.png" alt="HEXAGES GAMES logosu" width="44" height="44">
          <h1>Şifre sıfırla</h1>
          <p class="sub">Hexages Games oyuncu portalı</p>
        </div>

        <div class="auth-card">
          <div style="position:relative;z-index:1">
            <p style="font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);margin-bottom:24px;line-height:1.7">
              E-posta adresinizi girin, şifre sıfırlama bağlantısı göndereceğiz.
            </p>

            <div id="error-msg" class="error-msg" style="display:none"></div>
            <div id="success-msg" class="success-msg" style="display:none">✓ Sıfırlama bağlantısı gönderildi! E-postanızı kontrol edin.</div>

            <div class="form-group">
              <label class="form-label">E-posta</label>
              <div class="form-input-wrap">
                <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
                <input type="email" id="input-email" class="form-input form-input-icon" placeholder="ornek@email.com">
              </div>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="handleReset()">Bağlantı gönder</button>
          </div>
        </div>

        <div class="auth-footer-link">
          <a href="giris.html">← Giriş sayfasına dön</a>
        </div>

      </div>
    </div>
  </main>

  <script type="module">
    import { getNavHTML } from './js/layout.js';
    import { auth, initTheme, initNavbar, sendPasswordResetEmail } from './js/app.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    initTheme(); initNavbar();

    window.handleReset = async () => {
      const email = document.getElementById('input-email').value.trim();
      const errEl = document.getElementById('error-msg');
      const okEl = document.getElementById('success-msg');
      const btn = document.getElementById('btn-submit');
      errEl.style.display = 'none';
      okEl.style.display = 'none';

      if (!email) { errEl.textContent = 'E-posta giriniz.'; errEl.style.display = 'block'; return; }

      btn.disabled = true;
      btn.textContent = 'Gönderiliyor...';
      try {
        await sendPasswordResetEmail(auth, email);
        okEl.style.display = 'block';
      } catch (e) {
        // [Güvenlik] Hesap varlığını sızdırmamak için aynı mesajı göster
        errEl.textContent = 'Bir hata oluştu. Tekrar deneyin.';
        errEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'Bağlantı gönder';
    };
  </script>
</body>
</html>
