<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifremi Unuttum | HEXAGES GAMES</title>
  <meta name="description" content="HEXAGES GAMES – Şifremi Unuttum.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="HEXAGES GAMES">
  <meta name="apple-mobile-web-app-title" content="HEXAGES">
  <!-- İkonlar: Google arama sonuçlarındaki favicon için 48x48 katı + .ico -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="layout-top"></div>

  <main>
    <div class="auth-page">
      <div class="auth-box anim-in anim-in-delay-1">

        <div class="auth-logo">
          <img src="https://media.base44.com/images/public/6a230fb4447836a5b131d0c7/03b7964ff_Varlk20.png" alt="Hexages" class="float-anim">
          <h1>ŞİFRE SIFIRLA</h1>
          <p class="sub">HEXAGES GAMES // PLAYER PORTAL</p>
        </div>

        <div class="auth-card">
          <div class="shimmer" style="position:absolute;inset:0;pointer-events:none"></div>
          <div style="position:relative;z-index:1">
            <p style="font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);margin-bottom:24px;line-height:1.7">
              E-posta adresinizi girin, şifre sıfırlama bağlantısı göndereceğiz.
            </p>

            <div id="error-msg" class="error-msg" style="display:none"></div>
            <div id="success-msg" class="success-msg" style="display:none"> Sıfırlama bağlantısı gönderildi! E-postanızı kontrol edin.</div>

            <div class="form-group">
              <label class="form-label">E-POSTA</label>
              <div class="form-input-wrap">
                <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg></span>
                <input type="email" id="input-email" class="form-input form-input-icon" placeholder="ornek@email.com">
              </div>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="handleReset()">BAĞLANTI GÖNDER</button>
          </div>
        </div>

        <div class="auth-footer-link">
          <a href="giris.html">← Giriş sayfasına dön</a>
        </div>

      </div>
    </div>
  </main>

  <script type="module">
    import { getNavHTML } from './js/layout.js';
    import { auth, initStarfield, initCursorGlow, initTheme, initNavbar, sendPasswordResetEmail } from './js/app.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    initTheme(); initStarfield(); initCursorGlow(); initNavbar();

    window.handleReset = async () => {
      const email = document.getElementById('input-email').value.trim();
      const errEl = document.getElementById('error-msg');
      const okEl = document.getElementById('success-msg');
      const btn = document.getElementById('btn-submit');
      errEl.style.display = 'none';
      okEl.style.display = 'none';

      if (!email) { errEl.textContent = 'E-posta giriniz.'; errEl.style.display = 'block'; return; }

      btn.disabled = true;
      btn.textContent = 'GÖNDERİLİYOR...';
      try {
        await sendPasswordResetEmail(auth, email);
        okEl.style.display = 'block';
      } catch (e) {
        // [GÜVENLİK] Hesap varlığını sızdırmamak için aynı mesajı göster
        errEl.textContent = 'Bir hata oluştu. Tekrar deneyin.';
        errEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'BAĞLANTI GÖNDER';
    };
  </script>
</body>
</html>
