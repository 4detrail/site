            <a href="chasing-the-shlump.html" class="btn-download outline">← Tüm haberler</a>

          </div>
        </article>

        <div id="not-found" style="display:none;text-align:center;padding:80px 0">
          <h1 style="font-weight:900;font-size:clamp(2.5rem,7vw,5rem)">Haber bulunamadı</h1>

    </section>
  </main>

  <div id="layout-footer"></div>

  <script type="module">
    import { getNavHTML, getFooterHTML } from './js/layout.js';
    import { NEWS, getNews } from './js/news.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    document.getElementById('layout-footer').innerHTML = getFooterHTML();

    const id = new URLSearchParams(location.search).get('id') || NEWS[0]?.id;
    const n = getNews(id);

    if (!n) {
      document.getElementById('article').style.display = 'none';
      document.getElementById('not-found').style.display = 'block';
      document.title = 'Haber bulunamadı – HEXAGES GAMES';
      const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m);
    } else {
      const url = 'https://hexagesgames.vercel.app/haber.html?id=' + encodeURIComponent(n.id);
      document.title = n.title + ' | Chasing the Shlump – HEXAGES GAMES';
      document.querySelector('meta[name="description"]').content = n.excerpt;
      document.getElementById('canon').href = url;
      document.getElementById('og-url').content = url;
      document.getElementById('og-title').content = n.title;
      document.getElementById('og-desc').content = n.excerpt;

      document.getElementById('crumb-title').textContent = n.title;
      document.getElementById('a-tag').textContent = n.tag;
      document.getElementById('a-title').textContent = n.title;
      document.getElementById('a-date').textContent = n.date;
      document.getElementById('a-dev').textContent = n.developer;

      const cover = document.getElementById('a-cover');
      if (n.cover) {
        const img = document.createElement('img'); img.className = 'cover'; img.alt = n.title; img.src = n.cover; cover.appendChild(img);
      } else {
        cover.innerHTML = '<div class="fcard-art art-shlump"><div class="art-pattern"></div></div><div class="news-thumb-logo"><img src="logo-hx.png" alt=""></div>';
      }

      const body = document.getElementById('a-body');
      n.body.forEach((b) => {
        let el;
        if (typeof b === 'string') { el = document.createElement('p'); el.textContent = b; }
        else if (b.h) { el = document.createElement('h2'); el.textContent = b.h; }
        else if (b.list) { el = document.createElement('ul'); b.list.forEach((t) => { const li = document.createElement('li'); li.textContent = t; el.appendChild(li); }); }
        else if (b.note) { el = document.createElement('div'); el.className = 'article-note'; el.textContent = b.note; }
        if (el) body.appendChild(el);
      });

      // Tarih belliyse Google için NewsArticle şeması ekle
      if (n.dateISO) {
        const ld = document.createElement('script'); ld.type = 'application/ld+json';
        ld.textContent = JSON.stringify({
          '@context': 'https://schema.org', '@type': 'NewsArticle', headline: n.title, description: n.excerpt,
          datePublished: n.dateISO, mainEntityOfPage: url,
          author: { '@type': 'Organization', name: n.developer },
          publisher: { '@type': 'Organization', name: 'HEXAGES GAMES', logo: { '@type': 'ImageObject', url: 'https://hexagesgames.vercel.app/logo-512.png' } },
          image: n.cover ? new URL(n.cover, location.href).href : 'https://hexagesgames.vercel.app/og-image.png'
        });
        document.head.appendChild(ld);
      }
    }

    try {
      const app = await import('./js/app.js');
      app.initTheme(); app.initNavbar(); app.initReveal(); app.initAuthNav();
      document.querySelectorAll('.nav-link[href="oyunlar.html"]').forEach((l) => l.classList.add('active'));
    } catch (e) { console.warn('app.js yüklenemedi:', e); }
  </script>
</body>
</html>
