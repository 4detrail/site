<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXAGES GAMES – Oyunlar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="layout-top"></div>

  <main>
    <section style="min-height:100vh;padding-top:128px;padding-bottom:96px;padding-left:24px;padding-right:24px">
      <div class="container">

        <!-- Header -->
        <div class="anim-in anim-in-delay-1" style="margin-bottom:64px">
          <span class="mono-label">// OYUNLAR</span>
          <h1 style="font-family:var(--font-heading);font-weight:900;font-size:clamp(3rem,8vw,7rem);line-height:1;margin-top:8px">OYUNLARIMIZ</h1>
          <p style="color:var(--muted-foreground);margin-top:16px;font-family:var(--font-mono);font-size:13px">Şu anda projeler üstünde çalışılıyor</p>
        </div>

        <!-- Glitch Banner -->
        <div class="anim-in anim-in-delay-2" style="position:relative;border:1px solid var(--border);padding:24px;margin-bottom:64px;overflow:hidden">
          <div class="shimmer" style="position:absolute;inset:0"></div>
          <div style="position:relative;display:flex;align-items:center;gap:16px">
            <div style="display:flex;gap:4px">
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.0s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.1s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.2s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.3s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.4s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.5s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.6s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.7s infinite alternate"></div>
            </div>
            <p class="glitch-text" data-text="SİSTEM ŞU ANDA PROJELER ÜSTÜNDE ÇALIŞIYOR — VERİ YÜKLENİYOR..." style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.2em;color:var(--muted-foreground)">
              SİSTEM ŞU ANDA PROJELER ÜSTÜNDE ÇALIŞIYOR — VERİ YÜKLENİYOR...
            </p>
          </div>
        </div>

        <!-- Game Cards Grid -->
        <div class="games-grid stagger-children" id="games-grid"></div>

        <!-- Bottom CTA -->
        <div style="margin-top:80px;text-align:center;border:1px solid var(--border);padding:64px 32px;position:relative;overflow:hidden" class="reveal">
          <div class="shimmer" style="position:absolute;inset:0"></div>
          <div style="position:relative">
            <span class="mono-label">// GÜNCELLEMELERİ TAKİP ET</span>
            <h2 style="font-family:var(--font-heading);font-weight:900;font-size:28px;margin-top:16px;margin-bottom:16px">HABERDAR OL</h2>
            <p style="color:var(--muted-foreground);font-family:var(--font-mono);font-size:13px;margin-bottom:32px">Oyunlar yayına girdiğinde ilk sen öğren. Discord'a katıl!</p>
            <a href="https://discord.gg/ETe46SWQtC" target="_blank" class="btn-download" style="font-size:11px">DİSCORD'A KATIL →</a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="layout-footer"></div>

  <style>
    @keyframes barPulse { from{transform:scaleY(1)} to{transform:scaleY(2)} }
    @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  </style>

  <script type="module">
    import { getNavHTML, getFooterHTML } from './js/layout.js';
    import { initStarfield, initCursorGlow, initTheme, initNavbar, initReveal, initAuthNav } from './js/app.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    document.getElementById('layout-footer').innerHTML = getFooterHTML();

    initTheme(); initStarfield(); initCursorGlow(); initNavbar(); initReveal(); initAuthNav();

    // Render game cards
    const projects = ['Proje #1','Proje #2','Proje #3','Proje #4','Proje #5','Proje #6'];
    const grid = document.getElementById('games-grid');
    projects.forEach((label, i) => {
      const pct = 20 + i * 10;
      grid.innerHTML += `
        <div class="game-card card-3d">
          <div class="game-card-bg"></div>
          <div class="game-card-scanlines shimmer" style="opacity:0.5"></div>
          <div style="position:absolute;inset:0;opacity:0.1;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.05) 2px,rgba(255,255,255,0.05) 4px)"></div>
          <div class="game-corner tl"></div>
          <div class="game-corner tr"></div>
          <div class="game-corner bl"></div>
          <div class="game-corner br"></div>
          <div class="game-dots">
            <div class="game-dot" style="animation:dotBlink 1s ${0}s infinite"></div>
            <div class="game-dot" style="animation:dotBlink 1s ${0.3}s infinite"></div>
            <div class="game-dot" style="animation:dotBlink 1s ${0.6}s infinite"></div>
          </div>
          <div class="game-content">
            <p class="game-title">COMING SOON</p>
            <p class="game-sub">${label}</p>
          </div>
          <div style="position:absolute;inset:0;background:rgba(255,255,255,0.05);opacity:0;transition:opacity 0.3s" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0'"></div>
          <div class="game-status-bar">
            <div class="game-status-row">
              <span class="game-status-label">STATUS</span>
              <span class="game-status-val">
                <span class="game-status-dot"></span>
                GELİŞTİRİLİYOR
              </span>
            </div>
            <div class="game-progress-bg">
              <div class="game-progress-fill" style="width:0%" data-width="${pct}%"></div>
            </div>
          </div>
        </div>
      `;
    });

    // Animate progress bars
    setTimeout(() => {
      document.querySelectorAll('.game-progress-fill').forEach(bar => {
        bar.style.width = bar.dataset.width;
      });
    }, 600);
  </script>
</body>
</html>
