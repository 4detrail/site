<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil – HEXAGES GAMES</title>
  <meta name="description" content="Oyuncu profili." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="HEXAGES GAMES" />
  <meta name="apple-mobile-web-app-title" content="HEXAGES GAMES" />

  <!-- Favicon / logo (Google için 48px'in katları) -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="/img/icons/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/img/icons/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="layout-top"></div>

  <main>
    <section style="min-height:100vh;padding-top:128px;padding-bottom:96px;padding-left:24px;padding-right:24px">
      <div class="container" style="max-width:1024px">

        <div class="anim-in anim-in-delay-1" style="margin-bottom:48px">
          <span class="eyebrow">Oyuncu dosyası</span>
          <h1 style="font-family:var(--font-heading);font-weight:500;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1;margin-top:8px">Profil</h1>
        </div>

        <div id="not-logged" style="display:none;text-align:center;padding:64px 24px;border:1px solid var(--border)">
          <p style="font-family:var(--font-mono);font-size:13px;color:var(--muted-foreground);margin-bottom:24px">Bu sayfayı görüntülemek için giriş yapmalısınız.</p>
          <a href="giris.html" class="btn-download" style="font-size:11px">Giriş YAP</a>
        </div>

        <div id="profile-content" style="display:none">
          <div class="profile-grid-react">
            <!-- Avatar sidebar -->
            <div class="profile-card" style="text-align:center">
              <div id="profile-avatar-wrap">
                <div class="profile-avatar float-anim" id="profile-avatar">?</div>
              </div>
              <div id="access-badge" class="access-badge">Oyuncu</div>
              <button onclick="handleLogout()" class="btn-logout">Çıkış yap</button>
            </div>

            <!-- Info -->
            <div class="profile-card profile-info-card">
              <span class="eyebrow" style="display:block;margin-bottom:24px">Kimlik bilgileri</span>

              <div class="profile-field">
                <label class="form-label">Kullanıcı adı</label>
                <div id="name-view" style="display:flex;align-items:center;gap:12px">
                  <span class="profile-name" id="profile-name">—</span>
                  <button onclick="startEdit()" class="btn-icon" type="button">✎</button>
                </div>
                <div id="name-edit" style="display:none;gap:8px;align-items:center">
                  <input type="text" id="edit-name" class="form-input" style="flex:1">
                  <button onclick="updateName()" class="btn-icon btn-icon-ok" type="button">✓</button>
                  <button onclick="cancelEdit()" class="btn-icon btn-icon-cancel" type="button">✕</button>
                </div>
                <div id="edit-error" class="error-msg" style="display:none;margin-top:8px"></div>
                <div id="edit-success" class="success-msg" style="display:none;margin-top:8px">Ad başarıyla güncellendi!</div>
              </div>

              <div class="profile-field">
                <label class="form-label">E-posta</label>
                <div class="profile-email" id="profile-email">—</div>
              </div>

              <div class="profile-field">
                <label class="form-label">Kayıt tarihi</label>
                <div class="profile-email" id="profile-joined">—</div>
              </div>

              <div class="profile-field" style="border-bottom:none;padding-bottom:0">
                <label class="form-label">Oyuncu ıd</label>
                <div class="profile-email" id="profile-uid" style="word-break:break-all">—</div>
              </div>
            </div>

            <!-- Quick links -->
            <div class="profile-card profile-quick-card">
              <span class="eyebrow" style="display:block;margin-bottom:20px">Hızlı erişim</span>
              <div class="quick-links-grid">
                <a href="ticket.html" class="quick-link-card">
                  <span class="quick-link-title">Ticketlarım</span>
                  <span class="quick-link-desc">Destek taleplerim</span>
                </a>
                <a href="launcher.html" class="quick-link-card">
                  <span class="quick-link-title">Launcher</span>
                  <span class="quick-link-desc">İndir &amp; güncelle</span>
                </a>
                <a href="oyunlar.html" class="quick-link-card">
                  <span class="quick-link-title">Oyunlar</span>
                  <span class="quick-link-desc">Gelecek projeler</span>
                </a>
                <a href="https://discord.gg/ETe46SWQtC" target="_blank" rel="noopener" class="quick-link-card">
                  <span class="quick-link-title">Discord</span>
                  <span class="quick-link-desc">Topluluğa katıl</span>
                </a>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="layout-footer"></div>

  <script type="module">
    import { getNavHTML, getFooterHTML } from './js/layout.js';
    import {
      auth, isAdmin, initTheme, initNavbar, initReveal, initAuthNav,
      onAuthStateChanged, signOut, updateProfile
    } from './js/app.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    document.getElementById('layout-footer').innerHTML = getFooterHTML();

    initTheme(); initNavbar(); initReveal(); initAuthNav();

    onAuthStateChanged(auth, user => {
      if (!user) {
        document.getElementById('not-logged').style.display = 'block';
        return;
      }
      document.getElementById('profile-content').style.display = 'block';

      const name = user.displayName || 'İsimsiz Oyuncu';
      const initial = (user.displayName || user.email || 'U').charAt(0).toUpperCase();

      const avatarWrap = document.getElementById('profile-avatar-wrap');
      if (user.photoURL) {
        avatarWrap.innerHTML = `<img src="${user.photoURL}" alt="Avatar" style="width:96px;height:96px;border-radius:50%;border:1px solid var(--border);margin:0 auto 20px;display:block">`;
      } else {
        document.getElementById('profile-avatar').textContent = initial;
      }

      document.getElementById('profile-name').textContent = name;
      document.getElementById('profile-email').textContent = user.email;
      document.getElementById('edit-name').value = user.displayName || '';

      const joined = user.metadata?.creationTime
        ? new Date(user.metadata.creationTime).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' })
        : 'Bilinmiyor';
      document.getElementById('profile-joined').textContent = joined;
      document.getElementById('profile-uid').textContent = user.uid;

      const badge = document.getElementById('access-badge');
      if (isAdmin(user.email)) {
        badge.textContent = 'Yönetici';
        badge.classList.add('admin');
      }
    });

    window.handleLogout = async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    };

    window.startEdit = () => {
      document.getElementById('name-view').style.display = 'none';
      const edit = document.getElementById('name-edit');
      edit.style.display = 'flex';
    };

    window.cancelEdit = () => {
      document.getElementById('name-edit').style.display = 'none';
      document.getElementById('name-view').style.display = 'flex';
      document.getElementById('edit-name').value = auth.currentUser?.displayName || '';
      document.getElementById('edit-error').style.display = 'none';
    };

    window.updateName = async () => {
      const name = document.getElementById('edit-name').value.trim();
      const errEl = document.getElementById('edit-error');
      const okEl = document.getElementById('edit-success');
      errEl.style.display = 'none';
      okEl.style.display = 'none';
      if (!name) {
        errEl.textContent = 'Ad boş olamaz.';
        errEl.style.display = 'block';
        return;
      }
      try {
        await updateProfile(auth.currentUser, { displayName: name });
        document.getElementById('profile-name').textContent = name;
        const avatar = document.getElementById('profile-avatar');
        if (avatar) avatar.textContent = name.charAt(0).toUpperCase();
        okEl.style.display = 'block';
        cancelEdit();
        setTimeout(() => { okEl.style.display = 'none'; }, 3000);
      } catch {
        errEl.textContent = 'Güncelleme başarısız.';
        errEl.style.display = 'block';
      }
    };
  </script>
</body>
</html>
