<body>
  <div id="layout-top"></div>

  <main>
    <header class="game-hero">
      <div class="fcard-art art-shlump"><div class="art-pattern"></div></div>
      <div class="container anim-in anim-in-delay-1">
        <div class="crumbs" aria-label="Sayfa yolu">
          <a href="index.html">Ana Sayfa</a><span class="sep">/</span><a href="oyunlar.html">Oyunlar</a><span class="sep">/</span><span>Chasing the Shlump</span>
        </div>
        <span class="chip" style="margin-top:20px"><i></i> Geliştiriliyor</span>
        <h1>Chasing the<br>Shlump</h1>
        <p class="lead" id="game-summary"></p>
      </div>
    </header>

    <section class="section" style="padding-bottom:0">
      <div class="container">
        <div class="info-grid reveal" style="margin-bottom:80px">
          <div class="info-cell"><span>Geliştirici</span><b id="g-dev"></b></div>
          <div class="info-cell"><span>Durum</span><b id="g-status"></b></div>
          <div class="info-cell"><span>Çıkış tarihi</span><b id="g-date"></b></div>
          <div class="info-cell"><span>Platform</span><b id="g-platform"></b></div>
        </div>

        <div class="sec-head reveal">
          <div><span class="mono-label">Haberler</span><h2 class="sec-title">Oyun haberleri</h2></div>
        </div>
        <div class="news-grid" id="news-list"></div>

        <div class="cta-band reveal" style="margin-top:96px">
          <span class="mono-label">Topluluk</span>
          <h2>Yeni haberleri kaçırma</h2>
          <p>Yeni haber yayınlandığında Discord sunucumuzda duyuracağız.</p>
          <a href="https://discord.gg/ETe46SWQtC" target="_blank" rel="noopener" class="btn-download">Discord'a katıl</a>
        </div>
      </div>
    </section>
  </main>

  <div id="layout-footer"></div>

  <script type="module">
    import { getNavHTML, getFooterHTML } from './js/layout.js';
    import { GAME, NEWS } from './js/news.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    document.getElementById('layout-footer').innerHTML = getFooterHTML();

    document.getElementById('game-summary').textContent = GAME.summary;
    document.getElementById('g-dev').textContent = GAME.developer;
    document.getElementById('g-status').textContent = GAME.status;
    document.getElementById('g-date').textContent = GAME.releaseDate;
    document.getElementById('g-platform').textContent = GAME.platform;

    const list = document.getElementById('news-list');
    NEWS.forEach((n) => {
      const a = document.createElement('a');
      a.className = 'news-card';
      a.href = 'haber.html?id=' + encodeURIComponent(n.id);
      const thumb = n.cover
        ? '<img alt="" loading="lazy">'
        : '<div class="fcard-art art-shlump"><div class="art-pattern"></div></div><div class="news-thumb-logo"><img src="logo-hx.png" alt=""></div>';
      a.innerHTML = '<div class="news-thumb"><span class="news-tag"></span>' + thumb + '</div>' +
        '<div class="news-body"><div class="news-meta"><span class="d">Tarih: <b></b></span><span class="v">Geliştirici: <b></b></span></div>' +
        '<h3 class="news-title"></h3><p class="news-excerpt"></p><span class="news-more">Haberi oku</span></div>';
      if (n.cover) a.querySelector('.news-thumb img').src = n.cover;
      a.querySelector('.news-tag').textContent = n.tag;
      a.querySelector('.d b').textContent = n.date;
      a.querySelector('.v b').textContent = n.developer;
      a.querySelector('.news-title').textContent = n.title;
      a.querySelector('.news-excerpt').textContent = n.excerpt;
      list.appendChild(a);
    });

    try {
      const app = await import('./js/app.js');
      app.initTheme(); app.initNavbar(); app.initReveal(); app.initAuthNav();
      document.querySelectorAll('.nav-link[href="oyunlar.html"]').forEach((l) => l.classList.add('active'));
    } catch (e) {
      console.warn('app.js yüklenemedi:', e);
      document.querySelectorAll('.reveal, .stagger-children').forEach((el) => el.classList.add('visible'));
    }
  </script>
</body>
</html>
