<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXAGES GAMES – Pluginlerimiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="layout-top"></div>

  <main>
    <section style="min-height:100vh;padding-top:128px;padding-bottom:96px;padding-left:24px;padding-right:24px">
      <div class="container">

        <div class="anim-in anim-in-delay-1" style="margin-bottom:64px">
          <span class="mono-label">// PLUGINLER</span>
          <h1 style="font-family:var(--font-heading);font-weight:900;font-size:clamp(3rem,8vw,7rem);line-height:1;margin-top:8px">PLUGINLERİMİZ</h1>
          <p style="color:var(--muted-foreground);margin-top:16px;font-family:var(--font-mono);font-size:13px">Minecraft sunucuları için HEXAGES eklentileri — Modrinth üzerinden indir</p>
        </div>

        <div class="anim-in anim-in-delay-2" style="position:relative;border:1px solid var(--border);padding:24px;margin-bottom:64px;overflow:hidden">
          <div class="shimmer" style="position:absolute;inset:0"></div>
          <div style="position:relative;display:flex;align-items:center;gap:16px">
            <div style="display:flex;gap:4px">
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.0s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.1s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.2s infinite alternate"></div>
              <div style="width:4px;height:16px;background:rgba(255,255,255,0.6);animation:barPulse 0.5s 0.3s infinite alternate"></div>
            </div>
            <p class="glitch-text" data-text="3 AKTİF PLUGIN — MODRINTH'DE YAYINDA" style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.2em;color:var(--muted-foreground)">
              3 AKTİF PLUGIN — MODRINTH'DE YAYINDA
            </p>
          </div>
        </div>

        <div class="games-grid stagger-children" id="plugins-grid"></div>

        <div style="margin-top:80px;text-align:center;border:1px solid var(--border);padding:64px 32px;position:relative;overflow:hidden" class="reveal">
          <div class="shimmer" style="position:absolute;inset:0"></div>
          <div style="position:relative">
            <span class="mono-label">// DAHA FAZLASI YAKINDA</span>
            <h2 style="font-family:var(--font-heading);font-weight:900;font-size:28px;margin-top:16px;margin-bottom:16px">YENİ PLUGINLER</h2>
            <p style="color:var(--muted-foreground);font-family:var(--font-mono);font-size:13px;margin-bottom:32px">Yeni eklentilerden haberdar olmak için Discord topluluğumuza katıl.</p>
            <a href="https://discord.gg/ETe46SWQtC" target="_blank" rel="noopener noreferrer" class="btn-download" style="font-size:11px">DİSCORD'A KATIL →</a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="layout-footer"></div>

  <style>
    @keyframes barPulse { from{transform:scaleY(1)} to{transform:scaleY(2)} }
    @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .plugin-card-link { display:block; text-decoration:none; color:inherit; }
    .plugin-card-link:hover .game-card { border-color: rgba(255,255,255,0.5); transform: translateY(-4px); }
    .plugin-card-link .game-card { transition: border-color 0.3s, transform 0.3s; }
    .plugin-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      padding: 4px 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      color: var(--muted-foreground);
    }
    .plugin-download {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      margin-top: 16px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .plugin-card-link:hover .plugin-download { opacity: 1; }
  </style>

  <script type="module">
    import { getNavHTML, getFooterHTML } from './js/layout.js';
    import { initStarfield, initCursorGlow, initTheme, initNavbar, initReveal, initAuthNav } from './js/app.js';

    document.getElementById('layout-top').innerHTML = getNavHTML();
    document.getElementById('layout-footer').innerHTML = getFooterHTML();

    initTheme();
    initStarfield();
    initCursorGlow();
    initNavbar();
    initReveal();
    initAuthNav();

    const plugins = [
      {
        name: 'HEXAGES BANKNOTES',
        desc: 'Sunucu ekonomisi için banknot sistemi',
        url: 'https://modrinth.com/plugin/hexagesbanknotes',
        tag: 'EKONOMİ'
      },
      {
        name: 'NEX ADMIN',
        desc: 'Güçlü yönetim ve moderasyon araçları',
        url: 'https://modrinth.com/plugin/nexadmin',
        tag: 'YÖNETİM'
      },
      {
        name: 'NEX DUELS',
        desc: 'Oyuncu düelloları ve arena sistemi',
        url: 'https://modrinth.com/plugin/nexduels',
        tag: 'PVP'
      }
    ];

    const grid = document.getElementById('plugins-grid');
    plugins.forEach((plugin, i) => {
      grid.innerHTML += `
        <a href="${plugin.url}" target="_blank" rel="noopener noreferrer" class="plugin-card-link">
          <div class="game-card card-3d">
            <div class="game-card-bg"></div>
            <div class="game-card-scanlines shimmer" style="opacity:0.5"></div>
            <div style="position:absolute;inset:0;opacity:0.1;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.05) 2px,rgba(255,255,255,0.05) 4px)"></div>
            <div class="game-corner tl"></div>
            <div class="game-corner tr"></div>
            <div class="game-corner bl"></div>
            <div class="game-corner br"></div>
            <div class="game-dots">
              <div class="game-dot" style="animation:dotBlink 1s ${i * 0.3}s infinite"></div>
              <div class="game-dot" style="animation:dotBlink 1s ${i * 0.3 + 0.3}s infinite"></div>
              <div class="game-dot" style="animation:dotBlink 1s ${i * 0.3 + 0.6}s infinite"></div>
            </div>
            <div class="game-content">
              <span class="plugin-badge">${plugin.tag}</span>
              <p class="game-title">${plugin.name}</p>
              <p class="game-sub">${plugin.desc}</p>
              <p class="plugin-download">MODRINTH'TE İNDİR →</p>
            </div>
            <div class="game-status-bar">
              <div class="game-status-row">
                <span class="game-status-label">PLATFORM</span>
                <span class="game-status-val">
                  <span class="game-status-dot" style="background:#00c853"></span>
                  MODRINTH
                </span>
              </div>
              <div class="game-progress-bg">
                <div class="game-progress-fill" style="width:0%" data-width="100%"></div>
              </div>
            </div>
          </div>
        </a>
      `;
    });

    setTimeout(() => {
      document.querySelectorAll('.game-progress-fill').forEach(bar => {
        bar.style.width = bar.dataset.width;
      });
    }, 600);
  </script>
</body>
</html>
